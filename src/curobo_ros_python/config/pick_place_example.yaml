# 坐标只示范格式，调用前换成实测值。四元数是 ROS xyzw，距离单位米。
# 本文件对应 /pick_place，只写 Action 字段。单独 /pick 或 /place 时，把 pick/place 改成顶层 task。
# 感知话题、类别和等待时间在 pick_place_client.py。默认用感知结果覆盖抓取 tool_pose；--no-perception 才用下面的坐标。
# 放置 tool_pose 不会被感知改写。完整规划后跟随节点启动配置：debug 下发仿真控制器，deploy 只发布和返回轨迹。
# 夹爪值是 URDF 关节位置（Lycus 为米）：0 全开，-0.042 全闭。
timeout: 180.0                 # 整次任务超时（秒）。0 使用节点默认 180，不是每一段各 180
pick:
  group_name: left_arm         # left_arm 或 right_arm。PickPlace 的放置必须是同一只手臂
  tool_pose:                   # 工具参考位姿。感知模式下被话题覆盖
    header: {frame_id: base_link}
    pose:
      position: {x: 0.60, y: 0.25, z: 1.10}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  # 到预抓取之前的路点，按数组顺序各规划一段。可以混用 joint 和 pose。
  # 每个路点只填一种：joint 不要再填 pose，pose 不要再填 joint_positions。
  # 关节角是该臂 7 个关节的弧度，顺序与 PlanJointGoal 相同。pose 是工具位姿。
  #
  # waypoints:
  #   - type: joint
  #     joint_positions: [0.10, 0.20, -0.10, 0.40, 0.00, 0.20, 0.00]
  #   - type: pose
  #     pose:
  #       header: {frame_id: base_link}
  #       pose:
  #         position: {x: 0.55, y: 0.25, z: 1.30}
  #         orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  waypoints: []
  # 下面三份按运动顺序。in_base_frame 为 false 时乘在末端坐标系：结果 = tool_pose × 这份位姿。
  # 为 true 时平移沿 base_link，旋转也绕 base_link。单位四元数表示不额外旋转。
  in_base_frame: false
  prepick_in_target:           # 1. 预抓取。false 时是末端 +Z 10 cm；true 时是 base_link +Z 10 cm
    position: {x: 0.0, y: 0.0, z: 0.10}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  pick_pose:                   # 2. 抓取。全 0 表示抓取就在 tool_pose 上
    position: {x: 0.0, y: 0.0, z: -0.05}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  lift_in_target:              # 3. 抬升，这里同样是 tool_pose +Z 10 cm
    position: {x: 0.0, y: 0.0, z: 0.10}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  # 抬升之后的额外终点。不需要这一段时保持 type: ""。只填一种。
  #
  # end_pose:
  #   type: pose
  #   pose:
  #     header: {frame_id: base_link}
  #     pose:
  #       position: {x: 0.45, y: 0.25, z: 1.35}
  #       orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  # 关节角写法：
  # end_pose:
  #   type: joint
  #   joint_positions: [0.20, 0.30, -0.20, 0.50, 0.00, 0.10, 0.00]
  end_pose: {type: ""}
  object_size: &object_size {x: 0.04, y: 0.04, z: 0.06} # 工件包围盒三边，米，必须都为正
  open_position: 0.0           # 张开，米
  close_position: -0.025       # 夹持位置，米；-0.042 为全闭
  gripper_duration: 0.5        # 每段张开/闭合插补时长，秒
place:
  group_name: left_arm         # 必须与 pick 相同。独立 Place 从当前反馈开始
  tool_pose:                   # 放置参考位姿。感知不会改这里
    header: {frame_id: base_link}
    pose:
      position: {x: 0.55, y: 0.40, z: 1.10}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  waypoints: []                # 到预放置之前，写法与 pick.waypoints 相同
  # 下面三份按运动顺序。in_base_frame 与抓取的含义相同。
  in_base_frame: false
  preplace_in_target:          # 1. 预放置。false 时是末端 +Z 10 cm；true 时是 base_link +Z 10 cm
    position: {x: 0.0, y: 0.0, z: 0.10}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  place_pose:                  # 2. 放置。全 0 表示放置就在 tool_pose 上
    position: {x: 0.0, y: 0.0, z: 0.0}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  retreat_in_target:           # 3. 撤退，这里同样是 tool_pose +Z 10 cm
    position: {x: 0.0, y: 0.0, z: 0.10}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  end_pose: {type: ""}         # 撤退之后的额外终点。type 为空则停在撤退位置
  # 单独 place 用这份尺寸。pick_place 复用上面 pick 的几何。
  object_size: *object_size
  open_position: 0.0           # 释放张开量，米
  gripper_duration: 0.5        # 释放插补时长，秒
