# 本次 ai 场景验证参数，单位 m / rad，四元数 ROS xyzw。
# 本文件只写 Action 字段。感知话题、类别、置信度和等待时间在 pick_place_client.py。
# 默认从 /obj_poses 选 label 11 的最高置信度目标，保留消息的 frame_id、时间戳和位姿写入 tool_pose。
# 测试脚本不做 TF 转换；规划节点通过 TF 将 tool_pose 转到 base_link 后组合相对位姿。
# pick_pose、预抓取、抬升都是相对 tool_pose 的位姿：T = T_tool * T_relative。
# place 同样以 tool_pose 为参考，place_pose、预放置、撤退都是相对位姿。--no-perception 时抓取使用文件里的 tool_pose。
# 规划节点自行读取当前 /all_points 与 /joint_states，本脚本不覆盖状态。
# 原测试左臂初始角：[1.427, 1.198617, -1.318531, 1.643608, -0.455530, -0.014667, 0.367348]
# 单独 place 假设当前已夹持工件，夹爪反馈须与 open_position 不同。
timeout: 180.0
pick:
  group_name: left_arm
  tool_pose:                 # 感知模式下 header 与位姿均由话题覆盖；--no-perception 才用这里
    header: {frame_id: base_link}
    pose:
      position: {x: 0.5715685148613545, y: 0.6410885634422302, z: 0.833051448521108}
      orientation: &tool_orientation
        {x: -0.22957529683877867, y: 0.11950933515490465, z: -0.44601491077688155, w: 0.8567866719650288}
  # 到预抓取点前的额外路点。混合格式详见 pick_place_example.yaml。
  waypoints: []
  # 下面三份按运动顺序。in_base_frame 为 false 时乘在末端坐标系；为 true 时沿 base_link。
  in_base_frame: false
  prepick_in_target:         # 1. 预抓取。false 时是末端 +Z 10 cm
    position: {x: 0.0, y: 0.0, z: 0.10}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  pick_pose:                 # 2. 抓取。全 0 表示抓取就在 tool_pose 上
    position: {x: 0.0, y: 0.0, z: 0.0}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  lift_in_target:            # 3. 抬升，这里同样是 tool_pose +Z 10 cm
    position: {x: 0.0, y: 0.0, z: 0.10}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  end_pose: {type: ""}      # 抬升后的额外终点，可填 type: joint / pose
  object_size: &object_size {x: 0.205217, y: 0.222000, z: 0.058100}
  open_position: 0.0        # Lycus 夹爪关节坐标：0 m 全开，-0.042 m 全闭
  close_position: -0.025
  gripper_duration: 0.5
place:
  group_name: left_arm
  tool_pose:                # 放置参考位姿。感知不会改这里
    header: {frame_id: base_link}
    pose:
      position: {x: 0.47156851486135454, y: 0.6410885634422302, z: 0.833051448521108}
      orientation: *tool_orientation
  waypoints: []
  # 下面三份按运动顺序。in_base_frame 与抓取的含义相同。
  in_base_frame: false
  preplace_in_target:       # 1. 预放置。false 时是末端 +Z 10 cm
    position: {x: 0.0, y: 0.0, z: 0.10}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  place_pose:               # 2. 放置。全 0 表示放置就在 tool_pose 上
    position: {x: 0.0, y: 0.0, z: 0.0}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  retreat_in_target:        # 3. 撤退，这里同样是 tool_pose +Z 10 cm
    position: {x: 0.0, y: 0.0, z: 0.10}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  end_pose: {type: ""}      # 撤退后的额外终点，可填 type: joint / pose
  # 单独 place 用这份尺寸，工件相对工具由 place_pose 反推。pick_place 复用这次抓取的几何。
  object_size: *object_size
  open_position: 0.0
  gripper_duration: 0.5
